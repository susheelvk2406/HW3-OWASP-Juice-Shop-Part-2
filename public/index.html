<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juice Shop Style Login Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .login-box {
      background: white;
      width: 340px;
      padding: 28px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: #333;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #444;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 11px;
      border: none;
      border-radius: 6px;
      background: #ff6f00;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .message {
      margin-top: 14px;
      font-size: 14px;
      min-height: 20px;
    }

    .error {
      color: #c62828;
    }

    .success {
      color: #2e7d32;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>

    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input type="text" id="email" name="email" placeholder="Enter email" />

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter password"
      />

      <button type="submit">Login</button>
      <div id="message" class="message"></div>
    </form>
  </div>

  <script src="/script.js"></script>
</body>
</html>
